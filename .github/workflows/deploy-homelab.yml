name: Deploy backend to homelab

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute app version
        id: app-version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.version }}
          tags: |
            ghcr.io/dat-honguyen/werewolf-be:latest
            ghcr.io/dat-honguyen/werewolf-be:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, homelab]
    steps:
      - name: Pull latest image and restart
        run: |
          podman pull ghcr.io/dat-honguyen/werewolf-be:latest
          systemctl --user restart werewolf-be
          systemctl --user is-active werewolf-be
